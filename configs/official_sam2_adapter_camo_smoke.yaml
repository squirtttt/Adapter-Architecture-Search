train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ../../load/CAMO/Images/Train
      root_path_2: ../../load/CAMO/GT
      cache: none
      split_key: train
      first_k: 1
  wrapper:
    name: train
    args:
      inp_size: 1024
      augment: false
  batch_size: 1

val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ../../load/CAMO/Images/Test
      root_path_2: ../../load/CAMO/GT
      cache: none
      split_key: test
      first_k: 1
  wrapper:
    name: val
    args:
      inp_size: 1024
  batch_size: 1

test_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: ../../load/CAMO/Images/Test
      root_path_2: ../../load/CAMO/GT
      cache: none
      split_key: test
      first_k: 1
  wrapper:
    name: val
    args:
      inp_size: 1024
  batch_size: 1

eval_type: cod
sam_checkpoint: ../../pretrained/sam2_hiera_base_plus.pt
data_norm:
  inp:
    sub: [0.5]
    div: [0.5]
  gt:
    sub: [0.5]
    div: [0.5]
  gt_rgb:
    sub: [0.5]
    div: [0.5]

model:
  name: sam
  args:
    inp_size: 1024
    loss: iou
    encoder_mode:
      name: sam
      stages: [2, 3, 16, 3]
      global_att_blocks: [12, 16, 20]
      window_pos_embed_bkg_spatial_size: [14, 14]
      window_spec: [8, 4, 14, 7]
      num_pos_feats: 256
      normalize: true
      scale:
      temperature: 10000
      d_model: 256
      backbone_channel_list: [896, 448, 224, 112]
      embed_dims: [112, 224, 448, 896]
      fpn_top_down_levels: [2, 3]
      fpn_interp_model: nearest
      img_size: 1024
      mlp_ratio: 4
      patch_size: 16
      qkv_bias: true
      use_rel_pos: true
      window_size: 14
      out_chans: 256
      scale_factor: 32
      input_type: fft
      freq_nums: 0.25
      prompt_type: highpass
      prompt_embed_dim: 256
      tuning_stage: 1234
      handcrafted_tune: true
      embedding_tune: true
      adaptor: adaptor
      embed_dim: 112
      depth: 24
      num_heads: 2
      global_attn_indexes: [12, 16, 20]

optimizer:
  name: adamw
  args:
    lr: 0.0002
lr_min: 1.0e-7
epoch_max: 1
epoch_val: 1
epoch_save: 1
