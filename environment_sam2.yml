name: aas_sam2
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - setuptools<80
  - wheel
  - numpy
  - pyyaml
  - pillow
  - tqdm
  - scipy
  - scikit-learn
  - tensorboard
  - pip:
      - torch>=2.5.1
      - torchvision>=0.20.1
      - opencv-python
      - imageio
      - matplotlib
      - tensorboardX
      - timm==0.4.12
      - attrs
      - hydra-core>=1.3
      - iopath
      - submitit
      - -e ./third_party/sam2
