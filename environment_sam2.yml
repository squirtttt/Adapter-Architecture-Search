name: aas_sam2
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pyyaml
  - pillow
  - tqdm
  - scipy
  - tensorboard
  - pip:
      - torch>=2.5.1
      - torchvision>=0.20.1
      - opencv-python
      - matplotlib
      - hydra-core>=1.3
      - iopath
      - submitit
      - -e ./third_party/sam2
